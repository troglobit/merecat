name: Bob the Builder

# Run on all branches, including all pull requests, except the 'dev'
# branch since that's where we run Coverity Scan (limited tokens/day)
on:
  push:
    branches:
      - '**'
      - '!dev'
  pull_request:
    branches:
      - '**'

jobs:
  build:
    # Verify we can build on latest Ubuntu with both gcc and clang
    name: ${{ matrix.compiler }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        compiler: [gcc, clang]
      fail-fast: false
    env:
      CC: ${{ matrix.compiler }}
    steps:
      - name: Install dependencies
        run: |
          # The runners' azure.archive.ubuntu.com mirror intermittently
          # stalls.  Fail over to the fallback mirror in seconds instead
          # of grinding through apt's two-minute default timeouts.
          printf 'Acquire::Retries "3";\nAcquire::http::Timeout "15";\nAcquire::https::Timeout "15";\n' \
              | sudo tee /etc/apt/apt.conf.d/99-timeout >/dev/null
          sudo apt-get -y update
          sudo apt-get -y install tree libconfuse-dev libssl-dev zlib1g-dev php-cgi
          # Build on all cores, the test step pins itself to -j1
          echo "MAKEFLAGS=-j$(nproc)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
      - name: Create configure script
        run: |
          ./autogen.sh
      - name: Build w/o HTTPS
        run: |
          ./configure --prefix=/ --without-ssl --enable-htaccess --enable-htpasswd
          make V=1
      - name: Build w/ HTTPS
        run: |
          make clean
          ./configure --prefix=/ --enable-htaccess --enable-htpasswd
          make V=1
      - name: Install to ~/tmp and Inspect
        run: |
          DESTDIR=~/tmp make install-strip
          tree ~/tmp
          ldd ~/tmp/sbin/merecat
          size ~/tmp/sbin/merecat
          ~/tmp/sbin/merecat -h
      - name: Run tests
        run: |
          # Tests must currently not run in parallel
          make -j1 check || (cat tests/test-suite.log; false)
      - name: Archive test logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-logs-${{ matrix.compiler }}
          path: |
            tests/*.log
            tests/*.trs
          if-no-files-found: warn
          retention-days: 14

  package:
    # Verify the Debian packaging still builds and passes lintian.  The
    # release job runs the same target, but only after the tag is pushed
    # and immutable, so catch a broken debian/ here instead.
    name: debian
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        run: |
          # The runners' azure.archive.ubuntu.com mirror intermittently
          # stalls.  Fail over to the fallback mirror in seconds instead
          # of grinding through apt's two-minute default timeouts.
          printf 'Acquire::Retries "3";\nAcquire::http::Timeout "15";\nAcquire::https::Timeout "15";\n' \
              | sudo tee /etc/apt/apt.conf.d/99-timeout >/dev/null
          sudo apt-get -y update
          sudo apt-get -y install build-essential devscripts equivs lintian
          # Install Build-Depends from debian/control rather than a copy
          # of the list here, so a missing dependency fails this job.
          sudo mk-build-deps --install --remove \
               --tool "apt-get -y --no-install-recommends" debian/control
      - name: Configure
        run: |
          ./autogen.sh
          ./configure
      - name: Build package
        run: |
          # The suite already ran in the build job, and dh_auto_test
          # honours nocheck, so skip it here rather than run it twice.
          DEB_BUILD_OPTIONS=nocheck make package
      - name: Collect package
        if: always()
        run: |
          # debuild drops its output next to the source tree; artifacts
          # must live inside the workspace to be uploadable.
          mkdir -p dist
          mv ../merecat_*.deb ../merecat-dbgsym_*.ddeb dist/ 2>/dev/null || true
          mv ../merecat_*.changes ../merecat_*.buildinfo dist/ 2>/dev/null || true
          ls -lF dist/
      - name: Inspect package
        run: |
          dpkg -I dist/merecat_*_amd64.deb
          dpkg -c dist/merecat_*_amd64.deb
      - name: Archive package
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: merecat-deb
          path: dist/
          if-no-files-found: warn
          retention-days: 14
